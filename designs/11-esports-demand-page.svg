<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1220" viewBox="0 0 1440 1220" fill="none">
  <!-- 11号电竞 · 游戏需求展示页 | 所有主要元素均按 group 分层，可导入设计工具编辑 -->
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#7C3AED"/><stop offset="1" stop-color="#06B6D4"/></linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="translate(1180 160) rotate(135) scale(520 420)"><stop stop-color="#41328E" stop-opacity=".8"/><stop offset="1" stop-color="#080A13" stop-opacity="0"/></radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%"><feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000" flood-opacity=".38"/></filter>
    <clipPath id="brand-clip"><rect x="80" y="30" width="42" height="42" rx="13"/></clipPath>
  </defs>

  <g id="Background"><rect width="1440" height="1220" fill="#080A13"/><rect width="1440" height="650" fill="url(#glow)"/></g>
  <g id="Header">
    <line x1="80" y1="92.5" x2="1360" y2="92.5" stroke="#FFFFFF" stroke-opacity=".12"/>
    <rect x="80" y="30" width="42" height="42" rx="13" fill="#11131A"/><image href="../图片/工作室图标.jpg" x="80" y="30" width="42" height="42" preserveAspectRatio="xMidYMid slice" clip-path="url(#brand-clip)"/>
    <text x="136" y="54" fill="#EEF2FF" font-family="Noto Sans SC, sans-serif" font-size="19" font-weight="700" letter-spacing="2">11号电竞</text>
    <text x="270" y="54" fill="#9BA4BD" font-family="Noto Sans SC, sans-serif" font-size="13">专业游戏服务工作室</text>
    <rect x="1250" y="36" width="110" height="34" rx="17" fill="#13182A" stroke="#FFFFFF" stroke-opacity=".15"/>
    <text x="1305" y="58" fill="#EEF2FF" font-family="Noto Sans SC, sans-serif" font-size="12" font-weight="600" text-anchor="middle">立即咨询</text>
  </g>

  <g id="Hero">
    <text x="80" y="166" fill="#A99CFF" font-family="DM Sans, sans-serif" font-size="11" font-weight="700" letter-spacing="3">ELEVEN ESPORTS STUDIO</text>
    <text x="80" y="244" fill="#EEF2FF" font-family="Noto Sans SC, sans-serif" font-size="54" font-weight="800">把游戏交给</text><text x="350" y="244" fill="#9B8CFF" font-family="Noto Sans SC, sans-serif" font-size="54" font-weight="800">专业的人</text>
    <text x="80" y="282" fill="#9BA4BD" font-family="Noto Sans SC, sans-serif" font-size="16">稳定 · 高效 · 值得信赖</text><text x="80" y="310" fill="#9BA4BD" font-family="Noto Sans SC, sans-serif" font-size="16">专注每一次成长体验</text>
    <g id="Progress"><rect x="80" y="318" width="380" height="3" rx="1.5" fill="#FFFFFF" fill-opacity=".12"/><rect x="80" y="318" width="130" height="3" rx="1.5" fill="url(#brand)"/></g>
  </g>

  <g id="Services-heading"><text x="80" y="402" fill="#A99CFF" font-family="DM Sans, sans-serif" font-size="11" font-weight="700" letter-spacing="3">OUR SERVICES</text><text x="80" y="444" fill="#EEF2FF" font-family="Noto Sans SC, sans-serif" font-size="34" font-weight="800">选择你的游戏</text><text x="80" y="474" fill="#9BA4BD" font-family="Noto Sans SC, sans-serif" font-size="15">每一份服务，都为更好的游戏体验而生</text></g>
  <g id="Game-sidebar">
    <rect x="80" y="500" width="310" height="420" rx="20" fill="#101426" stroke="#FFFFFF" stroke-opacity=".12"/>
    <g id="Game-01-Genshin"><rect x="96" y="516" width="278" height="82" rx="16" fill="#7C3AED" fill-opacity=".2" stroke="#A99CFF" stroke-opacity=".55"/>
      <rect x="112" y="532" width="50" height="50" rx="14" fill="url(#brand)"/><text x="137" y="563" fill="white" font-family="DM Sans, sans-serif" font-size="15" font-weight="800" text-anchor="middle">YS</text>
      <text x="178" y="563" fill="#EEF2FF" font-family="Noto Sans SC, sans-serif" font-size="16" font-weight="700">原神</text><text x="348" y="563" fill="#A99CFF" font-family="DM Sans, sans-serif" font-size="20" text-anchor="middle">→</text>
    </g>
    <g id="Game-02-Star-Rail" transform="translate(0 74)"><rect x="96" y="540" width="278" height="82" rx="16" fill="#13182A"/><rect x="112" y="556" width="50" height="50" rx="14" fill="#1B6684"/><text x="137" y="587" fill="white" font-family="DM Sans, sans-serif" font-size="15" font-weight="800" text-anchor="middle">SR</text><text x="178" y="587" fill="#EEF2FF" font-family="Noto Sans SC, sans-serif" font-size="16" font-weight="700">崩坏：星穹铁道</text></g>
    <g id="Game-03-Zenless" transform="translate(0 74)"><rect x="96" y="638" width="278" height="82" rx="16" fill="#13182A"/><rect x="112" y="654" width="50" height="50" rx="14" fill="#D65B22"/><text x="137" y="685" fill="white" font-family="DM Sans, sans-serif" font-size="15" font-weight="800" text-anchor="middle">ZZZ</text><text x="178" y="685" fill="#EEF2FF" font-family="Noto Sans SC, sans-serif" font-size="16" font-weight="700">绝区零</text></g>
    <g id="Game-04-Wuthering" transform="translate(0 74)"><rect x="96" y="736" width="278" height="82" rx="16" fill="#13182A"/><rect x="112" y="752" width="50" height="50" rx="14" fill="#2E8B78"/><text x="137" y="783" fill="white" font-family="DM Sans, sans-serif" font-size="15" font-weight="800" text-anchor="middle">WW</text><text x="178" y="783" fill="#EEF2FF" font-family="Noto Sans SC, sans-serif" font-size="16" font-weight="700">鸣潮</text></g>
  </g>

  <g id="Demand-content" transform="translate(0 100)">
    <g id="Demand-heading"><text x="442" y="402" fill="#9BA4BD" font-family="Noto Sans SC, sans-serif" font-size="12" font-weight="700" letter-spacing="2">需求</text><text x="442" y="442" fill="#EEF2FF" font-family="Noto Sans SC, sans-serif" font-size="28" font-weight="800">原神 · 服务需求</text><text x="1300" y="437" fill="#A99CFF" font-family="Noto Sans SC, sans-serif" font-size="13" text-anchor="end">3 项需求</text></g>
    <g id="Demand-card-01" filter="url(#shadow)"><rect x="442" y="470" width="858" height="142" rx="20" fill="#121629" stroke="#A99CFF" stroke-opacity=".32"/><rect x="466" y="494" width="48" height="48" rx="14" fill="#7C3AED" fill-opacity=".22"/><text x="490" y="524" fill="#C9C0FF" font-family="DM Sans, sans-serif" font-size="15" font-weight="800" text-anchor="middle">01</text><text x="538" y="512" fill="#EEF2FF" font-family="Noto Sans SC, sans-serif" font-size="18" font-weight="700">开荒规划与任务推进</text><text x="538" y="540" fill="#9BA4BD" font-family="Noto Sans SC, sans-serif" font-size="13">基于账号进度制定每日路线、资源优先级与探索节奏。</text><rect x="538" y="560" width="72" height="24" rx="12" fill="#FFFFFF" fill-opacity=".06"/><text x="574" y="577" fill="#BBC2D5" font-family="Noto Sans SC, sans-serif" font-size="10" text-anchor="middle">进度规划</text><rect x="620" y="560" width="72" height="24" rx="12" fill="#FFFFFF" fill-opacity=".06"/><text x="656" y="577" fill="#BBC2D5" font-family="Noto Sans SC, sans-serif" font-size="10" text-anchor="middle">任务协助</text><text x="1266" y="524" fill="#A99CFF" font-family="Noto Sans SC, sans-serif" font-size="12" text-anchor="end">需求状态 · 可沟通</text></g>
    <g id="Demand-card-02" filter="url(#shadow)"><rect x="442" y="632" width="858" height="142" rx="20" fill="#121629" stroke="#FFFFFF" stroke-opacity=".11"/><rect x="466" y="656" width="48" height="48" rx="14" fill="#06B6D4" fill-opacity=".18"/><text x="490" y="686" fill="#8CE9F7" font-family="DM Sans, sans-serif" font-size="15" font-weight="800" text-anchor="middle">02</text><text x="538" y="674" fill="#EEF2FF" font-family="Noto Sans SC, sans-serif" font-size="18" font-weight="700">角色养成与配队建议</text><text x="538" y="702" fill="#9BA4BD" font-family="Noto Sans SC, sans-serif" font-size="13">依据已有角色与资源，给出高性价比的培养和队伍搭配方案。</text><rect x="538" y="722" width="72" height="24" rx="12" fill="#FFFFFF" fill-opacity=".06"/><text x="574" y="739" fill="#BBC2D5" font-family="Noto Sans SC, sans-serif" font-size="10" text-anchor="middle">配队建议</text><rect x="620" y="722" width="72" height="24" rx="12" fill="#FFFFFF" fill-opacity=".06"/><text x="656" y="739" fill="#BBC2D5" font-family="Noto Sans SC, sans-serif" font-size="10" text-anchor="middle">资源规划</text><text x="1266" y="686" fill="#9BA4BD" font-family="Noto Sans SC, sans-serif" font-size="12" text-anchor="end">需求状态 · 待确认</text></g>
    <g id="Demand-card-03" filter="url(#shadow)"><rect x="442" y="794" width="858" height="142" rx="20" fill="#121629" stroke="#FFFFFF" stroke-opacity=".11"/><rect x="466" y="818" width="48" height="48" rx="14" fill="#7C3AED" fill-opacity=".18"/><text x="490" y="848" fill="#C9C0FF" font-family="DM Sans, sans-serif" font-size="15" font-weight="800" text-anchor="middle">03</text><text x="538" y="836" fill="#EEF2FF" font-family="Noto Sans SC, sans-serif" font-size="18" font-weight="700">深境螺旋与高难挑战</text><text x="538" y="864" fill="#9BA4BD" font-family="Noto Sans SC, sans-serif" font-size="13">根据当期环境复盘阵容，提供通关思路、操作建议和目标拆解。</text><rect x="538" y="884" width="72" height="24" rx="12" fill="#FFFFFF" fill-opacity=".06"/><text x="574" y="901" fill="#BBC2D5" font-family="Noto Sans SC, sans-serif" font-size="10" text-anchor="middle">深境螺旋</text><rect x="620" y="884" width="72" height="24" rx="12" fill="#FFFFFF" fill-opacity=".06"/><text x="656" y="901" fill="#BBC2D5" font-family="Noto Sans SC, sans-serif" font-size="10" text-anchor="middle">阵容复盘</text><text x="1266" y="848" fill="#9BA4BD" font-family="Noto Sans SC, sans-serif" font-size="12" text-anchor="end">需求状态 · 待确认</text></g>
  </g>
  <g id="Footer" transform="translate(0 110)"><line x1="80" y1="1028.5" x2="1360" y2="1028.5" stroke="#FFFFFF" stroke-opacity=".12"/><text x="80" y="1070" fill="#9BA4BD" font-family="Noto Sans SC, sans-serif" font-size="12">11号电竞 · 每一份服务，都为更好的游戏体验而生</text><text x="1360" y="1070" fill="#9BA4BD" font-family="DM Sans, sans-serif" font-size="12" text-anchor="end">© 2026 ELEVEN ESPORTS</text></g>
</svg>
